<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oki-Store | Future of Smart Living</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              space: '#05050A',
              'space-light': '#12121A',
              electric: '#00F0FF',
              neo: '#7B2CBF',
              ice: '#F8FAFC',
              mint: '#00FF94',
            },
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
              tech: ['Orbitron', 'sans-serif'],
            },
            backgroundImage: {
              'hero-gradient': 'linear-gradient(135deg, #05050A 0%, #1a1a2e 100%)',
              'glass': 'linear-gradient(145deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%)',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #05050A;
        color: #F8FAFC;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #05050A;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e1e2f;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7B2CBF;
      }
      .glass-panel {
        background: rgba(18, 18, 26, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
